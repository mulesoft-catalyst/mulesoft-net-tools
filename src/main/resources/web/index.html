<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
    <head>
        <link rel="stylesheet" href="css/app.css" type="text/css" />
        <title>Network Connectivity Tools</title>
        <base href=".">
    </head>
    <body>
        <div class="content">
            <div class="header">
                <h1>Network Connectivity Tools</h1>
            </div>

            <div class="tool-tabs" id="toolTabs" role="tablist" aria-label="Network tools"></div>

            <div class="workspace">
                <div class="tool-column">
                    <section class="panel" aria-labelledby="toolTitle">
                        <div class="panel-header">
                            <h2 id="toolTitle">Ping</h2>
                        </div>
                        <form id="theForm" class="tool-form" action="#">
                            <input name="operation" id="operation" type="hidden" value="ping" />
                            <div class="helpBox" id="toolHelp"></div>

                            <div class="field-grid">
                                <div class="field field-host">
                                    <label for="ip">Host</label>
                                    <input name="ip" placeholder="IP Address or Host" type="text" title="IP" id="ip" />
                                </div>

                                <div class="field field-port">
                                    <label for="port">Port</label>
                                    <input name="port" placeholder="Port" type="text" title="PORT" id="port" />
                                </div>

                                <div class="field field-dns">
                                    <label for="dnsServer">DNS Server</label>
                                    <input name="dnsServer" placeholder="DNS server" type="text" title="DNS SERVER" id="dnsServer" />
                                </div>

                                <div class="field field-method">
                                    <label for="method">Method</label>
                                    <select name="method" id="method">
                                        <option value="GET" selected>GET</option>
                                        <option value="POST">POST</option>
                                    </select>
                                </div>

                                <div class="field field-url full-width">
                                    <label for="url">URL</label>
                                    <input name="url" placeholder="http://host:port/path/" type="text" title="URL" id="url" />
                                </div>

                                <div class="check-field field-insecure full-width">
                                    <input name="insecure" type="checkbox" title="insecure" id="insecure" />
                                    <label for="insecure">Allow insecure TLS</label>
                                </div>

                                <div class="field field-headers full-width">
                                    <label>Headers</label>
                                    <div class="curl-headers" id="headersList"></div>
                                    <button type="button" class="secondary-action" id="addHeader">Add Header</button>
                                </div>

                                <div class="field field-body full-width">
                                    <div class="curl-field-toolbar">
                                        <div class="field">
                                            <label for="contentType">Content-Type</label>
                                            <select name="contentType" id="contentType">
                                                <option value="application/json" selected>application/json</option>
                                                <option value="application/xml">application/xml</option>
                                                <option value="text/plain">text/plain</option>
                                                <option value="application/x-www-form-urlencoded">application/x-www-form-urlencoded</option>
                                            </select>
                                        </div>
                                        <button type="button" class="secondary-action" id="formatBody">Format</button>
                                    </div>
                                    <label for="body">Body</label>
                                    <textarea name="body" placeholder='{ "id"=1, "name"="john" }' title="Body" id="body" rows="5"></textarea>
                                    <div class="memo" id="body_memo">Content-Type is reflected in Headers and sent with POST requests.</div>
                                </div>
                            </div>

                            <div class="actions">
                                <button type="button" id="check">Run</button>
                                <button type="button" id="clean">Clean Console</button>
                            </div>
                        </form>
                    </section>

                    <div id="notifications" class="notification-stack" aria-live="assertive" aria-atomic="true"></div>
                </div>

                <section class="panel console-panel" aria-labelledby="consoleTitle">
                    <div class="panel-header">
                        <h2 id="consoleTitle">Console</h2>
                    </div>
                    <div id="output" class="console" aria-live="polite">
                        <div class="console-empty">No commands have been run.</div>
                    </div>
                </section>
            </div>
        </div>

        <script src="js/app.js" type="text/javascript" defer></script>
    </body>
</html>
